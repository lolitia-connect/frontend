name: Build

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            node_modules
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Test proxies and contract extraction
        run: |
          bun run test:proxy
          bun run test:contract

      - name: Verify generated schema
        run: bun run api:verify

      - name: Check frontend/backend route contract
        run: bun run api:check

      - name: Check translations
        run: bun run i18n:status

      - name: Build
        run: bun run build
