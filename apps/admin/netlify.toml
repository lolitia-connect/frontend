# Netlify config for the PPanel admin web app (管理端).
#
# The build runs from the repository ROOT (Netlify's monorepo picker reads this
# file but executes at the repo root, not inside apps/admin). So the command is
# invoked at the root and `publish` is written relative to the root.
#
# Turborepo is scoped to THIS app only via `--filter` (the root `build:admin`
# script), so sibling apps (user / payment-portal / docs) are never built here.
#
# No `/api/*` proxy: the app forwards API traffic via its own next.config.ts
# rewrites driven by NEXT_PUBLIC_API_BASE_URL / NEXT_PUBLIC_API_PREFIX, set in
# the Netlify UI.
[build]
  command = "bun run build:admin"
  publish = "apps/admin/.next"

[build.environment]
  NODE_VERSION = "26"

[[plugins]]
  package = "@netlify/plugin-nextjs"
