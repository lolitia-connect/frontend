<!DOCTYPE html>
<html lang="en-US" translate="no">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="dark light" name="color-scheme">
    <meta name="google" content="notranslate">

    <!-- Favicons -->
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico"> -->
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">

    <!-- PWA -->
    <link href="/site.webmanifest" rel="manifest">
    <meta
      content="#FFFFFF"
      media="(prefers-color-scheme: light)"
      name="theme-color"
    >
    <meta
      content="#000000"
      media="(prefers-color-scheme: dark)"
      name="theme-color"
    >

    <!-- SEO -->
    <meta content="Loading..." name="description">
    <meta content="" name="keywords">

    <title>Loading...</title>
    <style>
      #splash { position: fixed; inset: 0; display: grid; place-items: center; }
      #app:not(:empty) ~ #splash { display: none; }
      #splash::after { content: ""; width: 2rem; height: 2rem; border: 3px solid #d4d4d8; border-top-color: #0891b2; border-radius: 50%; animation: splash-spin .8s linear infinite; }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #splash::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash" role="status" aria-label="Loading"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
