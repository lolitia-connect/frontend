# Netlify config for the PPanel user web app (user 端).
#
# The build runs from the repository ROOT (Netlify's monorepo picker reads this
# file but executes at the repo root, not inside apps/user). So the command is
# invoked at the root and `publish` is written relative to the root.
#
# Turborepo is scoped to THIS app only via `--filter` (the root `build:user`
# script), so sibling apps (admin / payment-portal / docs) are never built here.
#
# No API proxy: the browser calls the backend directly using the build-time
# NEXT_PUBLIC_API_BASE_URL (set in the Netlify UI). The backend must allow CORS
# from this site's origin.
[build]
  command = "bun run build:user"
  publish = "apps/user/.next"

[build.environment]
  NODE_VERSION = "26"

[[plugins]]
  package = "@netlify/plugin-nextjs"
