<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>OAuth Redirect</title>
    <meta content="0; url=/auth" http-equiv="refresh">
    <script>
    "use strict";

    // Providers redirect here without a URL fragment; forward to the App Router
    // pathname route, preserving every parameter. Telegram's redirect flow can
    // return the signed payload in the hash fragment (`#tgAuthResult=...`), so
    // merge the hash into the query before forwarding.
    // Bridge /oauth/<provider>[/]?... -> /oauth/<provider>?...
    (() => {
      try {
        let path = window.location.pathname || "/";
        path = path.replace(/\/$/, "");

        const params = new URLSearchParams(window.location.search || "");
        const hash = (window.location.hash || "").replace(/^#/, "");
        if (hash) {
          new URLSearchParams(hash).forEach((value, key) => {
            if (!params.has(key)) {
              params.set(key, value);
            }
          });
        }

        const mergedSearch = params.toString();
        const target = mergedSearch ? `${path}?${mergedSearch}` : path;
        const payload = Object.fromEntries(params.entries());

        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage(payload, window.location.origin);
            window.opener.focus();
          } catch {
            // ignore opener message errors
          }

          window.setTimeout(() => {
            window.close();

            if (!window.closed) {
              window.location.replace(target);
            }
          }, 150);
          return;
        }

        window.location.replace(target);
      } catch {
        window.location.replace("/auth");
      }
    })();
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>
